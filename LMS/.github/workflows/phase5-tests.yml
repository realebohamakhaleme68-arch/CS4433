name: Phase 5 - Verification and Validation

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLMS_USE_LIBSODIUM=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run GoogleTest and integration suite
        run: ctest --test-dir build --output-on-failure
